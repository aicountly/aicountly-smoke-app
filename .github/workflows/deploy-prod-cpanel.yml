name: Deploy to cPanel via SSH (manual Production)

# Manual-only. Trigger via Actions UI → Run workflow (no prompts).
#
# cPanel layout (PROD_REMOTE_ROOT = document root, e.g. public_html):
#   /                     ← frontend/dist (index.html, assets/)
#   /api/                 ← backend/ (CodeIgniter — api/public/index.php)
#   /worker/              ← Playwright worker (not web-facing)
#   /samples/ /migrations/ /smoke-reports/
#
# Secrets (SSH only): PROD_SSH_HOST, PROD_SSH_PORT, PROD_SSH_USER, PROD_REMOTE_ROOT, PROD_SSH_PRIVATE_KEY
# App config: maintain api/.env manually on the server — deploy never creates or overwrites it.
on:
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PHP_VERSION: "8.2"

jobs:
  deploy:
    name: Deploy full stack to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.PROD_SSH_HOST }}" ]; then echo "::error::Missing repository secret: PROD_SSH_HOST"; missing=1; fi
          if [ -z "${{ secrets.PROD_SSH_PORT }}" ]; then echo "::error::Missing repository secret: PROD_SSH_PORT"; missing=1; fi
          if [ -z "${{ secrets.PROD_SSH_USER }}" ]; then echo "::error::Missing repository secret: PROD_SSH_USER"; missing=1; fi
          if [ -z "${{ secrets.PROD_SSH_PRIVATE_KEY }}" ]; then echo "::error::Missing repository secret: PROD_SSH_PRIVATE_KEY"; missing=1; fi
          if [ -z "${{ secrets.PROD_REMOTE_ROOT }}" ]; then echo "::error::Missing repository secret: PROD_REMOTE_ROOT"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All required SSH deploy secrets are present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, curl, openssl
          tools: composer:v2

      - name: Install Node dependencies
        run: npm ci

      - name: Create frontend .env for production build
        working-directory: frontend
        run: |
          printf 'VITE_API_BASE_URL=%s\nVITE_APP_NAME=%s\n' \
            "/api/v1" \
            "AICountly Smoke" \
            > .env

      - name: Build frontend
        run: npm run frontend:build

      - name: Prepare frontend for document root
        run: |
          cp deploy/public_html.htaccess frontend/dist/.htaccess
          cp frontend/dist/index.html frontend/dist/404.html

      - name: Build worker
        run: npm run worker:build

      - name: Install backend dependencies (production)
        working-directory: backend
        run: |
          composer config audit.block-insecure false
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.PROD_SSH_PORT }}" "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host cpanel-prod
            HostName ${{ secrets.PROD_SSH_HOST }}
            Port ${{ secrets.PROD_SSH_PORT }}
            User ${{ secrets.PROD_SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish the single reviewed HTTPS rewrite and verify the production notice
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum deploy/public_html.htaccess | cut -d' ' -f1)" = 3ffbaad95bcb59775e3ef87878e60b07c786095679542f2867b3e0404b050f9a
          remote=(ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes cpanel-prod)
          apply() {
            {
              printf 'operation=%q\n' "$1"
              printf 'payload=%q\n' "$(base64 -w0 deploy/public_html.htaccess)"
              cat <<'REMOTE'
          set -euo pipefail
          umask 077
          test "$(id -un)" = smokeaicountly
          cd "$HOME/public_html"
          [[ -f .htaccess && ! -L .htaccess && -O .htaccess ]]
          backup="$HOME/.htaccess-before-https-20261118-7e1dcba67cbe2bcf6259acd99306d1ed7bf335c9475163587c4bfbd988a8a010"
          if [ "$operation" = install ]; then
            test "$(sha256sum .htaccess | cut -d' ' -f1)" = 7e1dcba67cbe2bcf6259acd99306d1ed7bf335c9475163587c4bfbd988a8a010
            if [ ! -e "$backup" ]; then (set -C; cat .htaccess > "$backup"); fi
            [[ -f "$backup" && ! -L "$backup" && -O "$backup" ]]
            test "$(sha256sum "$backup" | cut -d' ' -f1)" = 7e1dcba67cbe2bcf6259acd99306d1ed7bf335c9475163587c4bfbd988a8a010
            want=3ffbaad95bcb59775e3ef87878e60b07c786095679542f2867b3e0404b050f9a; existing=7e1dcba67cbe2bcf6259acd99306d1ed7bf335c9475163587c4bfbd988a8a010
          else
            test "$operation" = restore
            [[ -f "$backup" && ! -L "$backup" && -O "$backup" ]]
            want=7e1dcba67cbe2bcf6259acd99306d1ed7bf335c9475163587c4bfbd988a8a010; existing=3ffbaad95bcb59775e3ef87878e60b07c786095679542f2867b3e0404b050f9a
          fi
          tmp=$(mktemp .htaccess.https-XXXXXX)
          trap 'rm -f -- "$tmp"' EXIT
          cp --preserve=all -- .htaccess "$tmp"
          if [ "$operation" = install ]; then printf '%s' "$payload" | base64 -d > "$tmp"; else cat "$backup" > "$tmp"; fi
          test "$(sha256sum "$tmp" | cut -d' ' -f1)" = "$want"
          test "$(stat -c '%u:%g:%a' "$tmp")" = "$(stat -c '%u:%g:%a' .htaccess)"
          test "$(sha256sum .htaccess | cut -d' ' -f1)" = "$existing"
          mv -f -- "$tmp" .htaccess
          REMOTE
            } | "${remote[@]}" 'bash -s'
          }
          apply install
          verify() {
            local response code
            for path in / /index.html; do
              response=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' "http://smoke.aicountly.org$path") || return 1
              test "$response" = "301 https://smoke.aicountly.org$path" || return 1
            done
            code=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/https-notice-page" -w '%{http_code}' https://smoke.aicountly.org/) || return 1
            test "$code" = 200 && grep -q 'maintenance-notice-20261118' "$RUNNER_TEMP/https-notice-page"
          }
          if ! verify; then apply restore; exit 1; fi
